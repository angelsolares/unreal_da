[/Script/UnrealEd.ProjectPackagingSettings]
; QUE MAPAS ENTRAN EN EL BUILD. Hay que decirlo A MANO y esto no es opcional:
; el cocinador solo arrastra lo que esta REFERENCIADO, y el titulo llega a Malkuth
; con `OpenLevel(MapaDestino)`, donde MapaDestino es un FName -- una cadena, no una
; referencia dura. Sin estas lineas el build sale con UN SOLO MAPA (L_DA_Titulo) y
; al pulsar Enter no pasa nada, porque el mapa de destino no existe en el paquete.
; Comprobado en el Manifest_UFSFiles del primer build: solo Entry.umap y L_DA_Titulo.umap.
; Los doce sub-mapas de Malkuth SI vienen solos: las Level Instances del maestro si
; son referencia dura.
+MapsToCook=(FilePath="/Game/DarkAngels/Maps/L_DA_Titulo")
+MapsToCook=(FilePath="/Game/DarkAngels/Maps/L_DA_Malkuth_Master")

; DA Debug HUD: herramientas de desarrollo. NO se cocinan, asi que en un build
; empaquetado estos assets no existen — que es proteccion mas fuerte que un
; "if" en tiempo de ejecucion. El unico que los pide es BP_DA_DebugZonas, y lo
; hace por referencia BLANDA: si no estan, se cae al HUD normal del juego.
; Si algun dia hiciera falta un build de prueba CON las herramientas, basta con
; comentar esta linea.
+DirectoriesToNeverCook=(Path="/Game/DarkAngels/Debug")

; Mapas muertos. Sin esto el cocinado se los traga TODOS —23 mapas: 13 en
; _Archivo, 5 backups y las 5 arenas de la Forja— porque no hay MapsToCook y el
; cocinador barre /Game entero. Comprobado antes de excluirlos: NINGUN asset vivo
; los referencia, asi que no se rompe nada y el build deja de cargar con ellos.
; Ademas quita un riesgo real: los _POC son la estructura vieja de mapa unico,
; anterior al maestro con Level Instances, y un mapa archivado que ya no abre
; TUMBA EL COCINADO entero.
+DirectoriesToNeverCook=(Path="/Game/DarkAngels/Maps/_Archivo")
+DirectoriesToNeverCook=(Path="/Game/DarkAngels/Maps/Backup")
; La Forja es banco de pruebas, no juego: son arenas de medicion.
+DirectoriesToNeverCook=(Path="/Game/DarkAngels/Maps/Encuentros")

